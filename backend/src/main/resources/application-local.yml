spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/alamano}
    username: ${SUPABASE_DB_USER:alamano}
    password: ${SUPABASE_DB_PASSWORD:alamano123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
