spring:
  datasource:
    url: jdbc:h2:mem:alamanotest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholder-replacement: false

app:
  jwt:
    secret: clave_test_a_la_mano_udea_2026_minimo_treinta_y_dos_bytes_seguros
    expiracion-ms: 3600000
  autenticacion:
    max-intentos-fallidos: 5
    minutos-bloqueo: 15
  storage:
    tipo: local
    local-dir: target/test-uploads
    firma-secret: clave_firma_test_a_la_mano_udea_2026_32_bytes
    expiracion-url-segundos: 300
  cors:
    allowed-origins: http://localhost:8081
  public-base-url: http://localhost:8080
  tarifa:
    tasa-cambio-cop-usd: 4000.00
  pagos:
    pasarela: simulada
